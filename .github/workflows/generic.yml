name: generic-pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/Attendify/global.json
      - run: dotnet test backend/Attendify/Attendify.slnx --nologo

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/Attendify/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/Attendify/package-lock.json
      - run: dotnet build backend/Attendify/Attendify.slnx --nologo
      - run: npm ci
        working-directory: webapp/Attendify
      - run: npm run build
        working-directory: webapp/Attendify
